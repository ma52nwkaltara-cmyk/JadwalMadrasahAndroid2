
name: Build Jadwal Madrasah APK

on:
  workflow_dispatch:
  push:
    paths:
      - "proyek_apk_jadwal_madrasah_build_otomatis.zip"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q proyek_apk_jadwal_madrasah_build_otomatis.zip -d source
          test -f source/JadwalMadrasahAndroid/settings.gradle.kts

      - name: Build APK
        run: |
          cd source/JadwalMadrasahAndroid
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jadwal-Madrasah-APK
          path: source/JadwalMadrasahAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
